name: Auto Deploy Feature Branch to Main

on:
  push:
    branches:
      - 'claude/**'
      - 'codex/**'

# Serialize merges so two feature branches pushed at the same time can't
# race each other into main.
concurrency:
  group: auto-deploy-main
  cancel-in-progress: false

jobs:
  beta-readiness:
    name: Beta Readiness Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run release:beta:check

  sync-to-main:
    name: Sync to Main
    needs: beta-readiness
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge to main and push
        run: |
          git checkout main
          git merge origin/${{ github.ref_name }} --no-edit -m "Auto-merge ${{ github.ref_name }} to main"
          git push origin main
